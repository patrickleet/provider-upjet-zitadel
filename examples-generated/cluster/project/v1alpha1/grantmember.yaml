apiVersion: project.zitadel.crossplane.io/v1alpha1
kind: GrantMember
metadata:
  annotations:
    meta.upbound.io/example-id: project/v1alpha1/grantmember
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    grantIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    humanUserIdSelector:
      matchLabels:
        testing.upbound.io/example-name: zitadel_human_user
    orgIdSelector:
      matchLabels:
        testing.upbound.io/example-name: zitadel_org
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: zitadel_project
    roles:
    - PROJECT_GRANT_OWNER
