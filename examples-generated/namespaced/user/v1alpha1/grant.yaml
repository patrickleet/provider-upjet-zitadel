apiVersion: user.zitadel.m.crossplane.io/v1alpha1
kind: Grant
metadata:
  annotations:
    meta.upbound.io/example-id: user/v1alpha1/grant
  labels:
    testing.upbound.io/example-name: default
  name: default
  namespace: crossplane-system
spec:
  forProvider:
    orgIdSelector:
      matchLabels:
        testing.upbound.io/example-name: zitadel_org
    projectIdSelector:
      matchLabels:
        testing.upbound.io/example-name: zitadel_project
    roleKeys:
    - super-user
    userIdSelector:
      matchLabels:
        testing.upbound.io/example-name: zitadel_human_user
